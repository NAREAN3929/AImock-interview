version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: interview_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ai_mock_interview
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=supersecretjwtkey_ai_mock_interview_2026
      - DATABASE_URL=mysql+pymysql://root:rootpassword@mysql:3306/ai_mock_interview
      - ALLOWED_ORIGINS=*

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  mysql_data:
